name: Soloprint
version: 1.1.0
description: 'Soloprint is a minimal, book-like theme for a single publication.'
author: Typemill
homepage: https://typemill.net
repo: https://github.com/typemill-resources/soloprint
license: MIT

settings:
  # Landing page copy
  kicker: 'A short field guide'
  title: 'Typemill'
  tagline: 'Six essays on doing fewer things, at a pace that lets you notice what you are doing.'
  startButtonLabel: 'Start reading'
  startButtonLink: ''
  secondButtonLabel: 'Order the book'
  secondButtonLink: '#order'
  authorLabel: 'Written by'
  authorName: 'John'

  # Elements
  headerbutton: true
  headerbuttonLabel: 'Order'
  headerbuttonLink: '#order'
  bottompager: true
  darkmodebutton: true
  darkmodedefault: false
  collapsiblenav: false

  # Edition footer strip
  footerLine: 'Also available as a printed edition, $22.'
  footerLink1Label: 'Download PDF'
  footerLink1Url: '#'
  footerLink2Label: 'Download ePub'
  footerLink2Url: '#'
  footerLink3Label: 'Order print'
  footerLink3Url: '#'

  # Colors (configured below in forms)
  paper: '#f5f3ec'
  paperRaised: '#ebe7da'
  cardBg: '#fefdfa'
  ink: '#21211c'
  inkSoft: '#6b6a5f'
  accent: '#3c5a45'
  line: '#8d8877'
  cardLine: '#F2F2F2'
  bandBg: '#21211c'
  bandFg: '#f5f3ec'

  # Dark mode colors
  paperDark: '#1a1a17'
  paperRaisedDark: '#242420'
  cardBgDark: '#20201c'
  inkDark: '#e8e6df'
  inkSoftDark: '#99968a'
  accentDark: '#7ab889'
  lineDark: '#6f6f64'
  cardLineDark: '#6f6f64'
  bandBgDark: '#e8e6df'
  bandFgDark: '#1a1a17'

  # Fonts (system fonts only)
  serifFont: "Georgia, Cambria, 'Times New Roman', Times, serif"
  sansFont: "system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif"

