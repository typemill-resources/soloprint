forms:
  fields:

    landing:
      type: fieldset
      legend: 'Landing Page'
      fields:
        kicker:
          type: text
          label: 'Kicker / Eyebrow'
          css: 'lg:w-full'
        title:
          type: text
          label: 'Title'
          css: 'lg:w-full'
        tagline:
          type: textarea
          label: 'Tagline'
          css: 'lg:w-full'
        startButtonLabel:
          type: text
          label: 'Start Button Label'
          css: 'lg:w-half'
        startButtonLink:
          type: text
          label: 'Start Button Link'
          placeholder: '/introduction'
          css: 'lg:w-half'
        secondButtonLabel:
          type: text
          label: 'Second Button Label'
          css: 'lg:w-half'
        secondButtonLink:
          type: text
          label: 'Second Button Link'
          placeholder: '#order'
          css: 'lg:w-half'
        authorLabel:
          type: text
          label: 'Author Line Prefix'
          placeholder: 'Written by'
          css: 'lg:w-full'
        authorName:
          type: text
          label: 'Author Name'
          placeholder: 'John'
          css: 'lg:w-full'

    elements:
      type: fieldset
      legend: 'Elements'
      fields:
        headerbutton:
          type: checkbox
          label: 'Header Button'
          checkboxlabel: 'Show a button in the header'
        headerbuttonLabel:
          type: text
          label: 'Header Button Label'
          placeholder: 'order'
          css: 'lg:w-half'      
        headerbuttonLink:
          type: text
          label: 'Header Button Link'
          placeholder: 'https://typemill.net'
          css: 'lg:w-half'
        breadcrumb:
          type: checkbox
          label: 'Breadcrumb'
          checkboxlabel: 'Show a breadcrumb above each page title'
        bottompager:
          type: checkbox
          label: 'Bottom Pager'
          checkboxlabel: 'Show a next page element at the bottom of the page'
        darkmodebutton:
          type: checkbox
          label: 'Dark Mode Toggle'
          checkboxlabel: 'Show the dark mode switch in the header'
        darkmodedefault:
          type: checkbox
          label: 'Dark Mode Default'
          checkboxlabel: 'Default to dark mode for visitors who have not chosen a mode yet'
        collapsiblenav:
          type: checkbox
          label: 'Collapsible Navigation'
          checkboxlabel: 'Let visitors expand and collapse folders in the navigation'

    colors:
      type: fieldset
      legend: 'Colors'
      fields:
        paper:
          type: text
          label: 'Page Background'
          placeholder: '#f5f3ec'
          css: 'lg:w-half'
        paperRaised:
          type: text
          label: 'Raised Surface'
          placeholder: '#ebe7da'
          css: 'lg:w-half'
        cardBg:
          type: text
          label: 'Card Background'
          placeholder: '#fefdfa'
          css: 'lg:w-half'
        ink:
          type: text
          label: 'Text Color'
          placeholder: '#21211c'
          css: 'lg:w-half'
        inkSoft:
          type: text
          label: 'Muted Text'
          placeholder: '#6b6a5f'
          css: 'lg:w-half'
        accent:
          type: text
          label: 'Accent / Hover'
          placeholder: '#3c5a45'
          css: 'lg:w-half'
        line:
          type: text
          label: 'Border / Rule'
          placeholder: '#8d8877'
          css: 'lg:w-half'
        cardLine:
          type: text
          label: 'Card Border'
          placeholder: '#98927f'
          css: 'lg:w-half'
        bandBg:
          type: text
          label: 'Next Band Background'
          placeholder: '#21211c'
          css: 'lg:w-half'
        bandFg:
          type: text
          label: 'Next Band Foreground'
          placeholder: '#f5f3ec'
          css: 'lg:w-half'

    darkColors:
      type: fieldset
      legend: 'Dark Mode Colors'
      fields:
        paperDark:
          type: text
          label: 'Dark Page Background'
          placeholder: '#1a1a17'
          css: 'lg:w-half'
        paperRaisedDark:
          type: text
          label: 'Dark Raised Surface'
          placeholder: '#242420'
          css: 'lg:w-half'
        cardBgDark:
          type: text
          label: 'Dark Card Background'
          placeholder: '#20201c'
          css: 'lg:w-half'
        inkDark:
          type: text
          label: 'Dark Text Color'
          placeholder: '#e8e6df'
          css: 'lg:w-half'
        inkSoftDark:
          type: text
          label: 'Dark Muted Text'
          placeholder: '#99968a'
          css: 'lg:w-half'
        accentDark:
          type: text
          label: 'Dark Accent / Hover'
          placeholder: '#7ab889'
          css: 'lg:w-half'
        lineDark:
          type: text
          label: 'Dark Border / Rule'
          placeholder: '#6f6f64'
          css: 'lg:w-half'
        cardLineDark:
          type: text
          label: 'Dark Card Border'
          placeholder: '#6f6f64'
          css: 'lg:w-half'
        bandBgDark:
          type: text
          label: 'Dark Next Band Background'
          placeholder: '#e8e6df'
          css: 'lg:w-half'
        bandFgDark:
          type: text
          label: 'Dark Next Band Foreground'
          placeholder: '#1a1a17'
          css: 'lg:w-half'

    fonts:
      type: fieldset
      legend: 'Fonts'
      fields:
        serifFont:
          type: text
          label: 'Serif Font Stack'
          placeholder: "Georgia, Cambria, 'Times New Roman', Times, serif"
          css: 'lg:w-full'
        sansFont:
          type: text
          label: 'Sans Font Stack'
          placeholder: "system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif"
          css: 'lg:w-full'

    footer:
      type: fieldset
      legend: 'Edition Footer'
      fields:
        footerLine:
          type: text
          label: 'Footer Line'
          css: 'lg:w-full'
        footerLink1Label:
          type: text
          label: 'Link 1 Label'
          css: 'lg:w-third'
        footerLink1Url:
          type: text
          label: 'Link 1 URL'
          css: 'lg:w-two-thirds'
        footerLink2Label:
          type: text
          label: 'Link 2 Label'
          css: 'lg:w-third'
        footerLink2Url:
          type: text
          label: 'Link 2 URL'
          css: 'lg:w-two-thirds'
        footerLink3Label:
          type: text
          label: 'Link 3 Label'
          css: 'lg:w-third'
        footerLink3Url:
          type: text
          label: 'Link 3 URL'
          css: 'lg:w-two-thirds'
